<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OjiMate — 画面デモ</title>
<meta name="description" content="集中するとおじさんも働く、サボるとおじさんもサボる。表裏一体の相棒と暮らす集中アプリ OjiMate の画面デモ。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#3F3A34;--ink-soft:#9B8F80;--sun:#FFC64B;--sky:#6FCBEE;--coral:#FF8A6B;--mint:#4FCFAE;--grape:#B08BF0;
    --card:rgba(255,255,255,.94);--shadow:0 3px 0 rgba(63,58,52,.09),0 6px 16px rgba(63,58,52,.10)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#26241F}
  body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-weight:500;
    color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center}
  #phone{position:relative;width:min(100vw,calc(100vh*9/16));height:min(100vh,calc(100vw*16/9));
    overflow:hidden;background:#A9D3E2;border-radius:26px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
  @media (max-aspect-ratio:9/16){#phone{border-radius:0}}
  #stage{position:absolute;inset:0}
  canvas{display:block;touch-action:none}
  #ui{position:absolute;inset:0;display:flex;flex-direction:column;padding:9px;gap:6px;pointer-events:none}
  #ui > *{pointer-events:auto}
  .spacer{flex:1;pointer-events:none}
  .card{background:var(--card);border-radius:16px;padding:9px 12px;box-shadow:var(--shadow)}
  /* 情報カードは常設せず、家をタップしたときだけせり上がる */
  #topRow{display:flex;gap:6px;align-items:flex-start;
    position:absolute;left:9px;right:9px;top:9px;z-index:8;
    opacity:0;transform:translateY(-10px);pointer-events:none;transition:opacity .22s,transform .22s}
  #ui.screen-home #topRow.open{opacity:1;transform:none;pointer-events:auto}
  #tapHint{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);
    font-size:11px;font-weight:700;color:#fff;background:rgba(38,36,31,.55);
    padding:5px 12px;border-radius:999px;pointer-events:none;z-index:5;
    opacity:0;transition:opacity .4s;white-space:nowrap}
  #tapHint.show{opacity:1}
  /* 初回だけ出す作業中チュートリアル：ゲージとおじさんの、タップできる場所を教える */
  #focusHint{position:absolute;right:14px;bottom:100px;max-width:172px;text-align:right;
    font-size:11px;font-weight:700;line-height:1.55;color:#fff;background:rgba(38,36,31,.6);
    padding:8px 13px;border-radius:14px;pointer-events:none;z-index:5;
    opacity:0;transition:opacity .4s}
  #focusHint.show{opacity:1}

  /* ===== 初回だけの導線チュートリアル =====
     実際の画面（HOME→PICK→FOCUS→完了）を暗く覆い、次に押すべきボタンだけを
     穴あき（スポットライト）で明るく残す。上下左右4枚の帯で覆うことで、
     穴の外側は実際にタップをブロックし、寄り道できないようにする */
  /* コンテナ自体は当たり判定を持たせず、実際にブロックするのは帯(.bar)と
     スキップボタンだけにする。透明な絶対配置要素は既定でクリックを拾って
     しまうため、穴の内側（実ボタン）まで塞がないよう明示的にnoneにする */
  #tutOverlay{position:absolute;inset:0;z-index:55;display:none;pointer-events:none}
  #tutOverlay.show{display:block}
  #tutOverlay .bar{position:absolute;background:rgba(20,18,15,.66);pointer-events:auto;
    transition:all .32s cubic-bezier(.22,.8,.28,1)}
  #tutHole{position:absolute;pointer-events:none;border-radius:20px;z-index:56;
    box-shadow:0 0 0 4px rgba(255,255,255,.95), 0 0 0 10px rgba(255,196,75,.6), 0 10px 32px rgba(0,0,0,.4);
    transition:all .32s cubic-bezier(.22,.8,.28,1)}
  @keyframes tutHolePulse{0%,100%{box-shadow:0 0 0 4px rgba(255,255,255,.95), 0 0 0 10px rgba(255,196,75,.6), 0 10px 32px rgba(0,0,0,.4)}
    50%{box-shadow:0 0 0 4px rgba(255,255,255,.95), 0 0 0 14px rgba(255,196,75,.32), 0 10px 32px rgba(0,0,0,.4)}}
  #tutHole.pulse{animation:tutHolePulse 1.4s ease-in-out infinite}
  #tutCallout{position:absolute;z-index:57;max-width:210px;background:var(--card);border-radius:16px;
    padding:13px 16px;box-shadow:var(--shadow);font-size:13px;line-height:1.62;color:var(--ink);
    pointer-events:none;transition:all .32s cubic-bezier(.22,.8,.28,1)}
  #tutCallout b{color:#B24E30}
  #tutCallout.center{max-width:240px;text-align:center;padding:22px 20px}
  #tutCallout .tut-emoji{font-size:30px;margin-bottom:8px}
  #tutCallout .btn{width:100%;margin-top:12px;pointer-events:auto}
  #tutSkip{position:absolute;z-index:57;right:12px;top:12px;
    background:rgba(20,18,15,.55);color:#fff;font-size:11.5px;font-weight:700;
    padding:7px 13px;border-radius:999px;border:0;cursor:pointer}
  #tutSkip:active{opacity:.7}
  /* 起動演出のあいだは下のUIを伏せておく */
  #ui.intro .on-home{opacity:0;transition:opacity .5s}
  #ui:not(.intro) .on-home{opacity:1;transition:opacity .5s}
  #home{flex:1}
  #stageName{font-size:14px;font-weight:700}
  #chips{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
  .chip{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:#FFF0D2;color:#B27A18}
  .chip.b{background:#DCF3FF;color:#1F7EA1}
  .chip.c{background:#E2FBF2;color:#1B8A6C}
  #bar{height:6px;border-radius:999px;background:#F0EBE2;margin-top:7px;overflow:hidden}
  #barFill{height:100%;width:0;border-radius:999px;background:var(--sun);transition:width .4s}
  #barNote{font-size:9.5px;color:var(--ink-soft);margin-top:4px;font-weight:700}
  #logList{display:flex;gap:4px;overflow-x:auto;margin-top:6px;scrollbar-width:none}
  #logList::-webkit-scrollbar{display:none}
  .rec{flex:none;font-size:9.5px;font-weight:700;padding:3px 7px;border-radius:8px;white-space:nowrap}
  .rec.ok{background:#E2FBF2;color:#1B8A6C}
  .rec.ng{background:#FFEFE9;color:#C4633F}
  #logEmpty{font-size:9.5px;color:var(--ink-soft)}

  /* ===== 画面ルーター ===== */
  #ui{transition:opacity .2s}
  .on-home{display:none!important}
  .on-pick{display:none!important}
  .on-focus{display:none!important}
  #ui.screen-home .on-home{display:flex!important}
  #ui.screen-pick .on-pick{display:flex!important}
  #ui.screen-focus .on-focus{display:flex!important}
  #ui.screen-home #dayQ:not([hidden]){display:flex}
  #ui.screen-home #dayQ[hidden]{display:none}
  #ui.screen-home #ctrl[hidden]{display:none!important}
  /* #dayQ の素の display:flex は「HOME画面かつhidden属性なし」の時だけ有効にしたい。
     PICK・FOCUSではhidden属性の有無にかかわらず常に隠す（素のID指定がhidden属性より詳細度で勝ってしまうため）。*/
  #ui.screen-pick #dayQ,#ui.screen-focus #dayQ{display:none!important}

  /* 作業中は右下のゲージだけ。#say は長押し確認の間だけ例外的にフェード表示 */
  #ui.screen-focus #say{
    display:flex!important;position:absolute;left:12px;right:118px;bottom:14px;
    opacity:0;pointer-events:none;transition:opacity .2s;margin:0;
  }
  #ui.screen-focus #say.show-confirm{opacity:1}

  #backBtn{position:absolute;left:12px;top:12px;z-index:7;pointer-events:auto;
    width:52px;height:52px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);
    font-size:21px;color:var(--ink);cursor:pointer;display:none;align-items:center;justify-content:center}
  #backBtn:active{transform:translateY(1px)}
  /* もう一度チュートリアルを見るための入口。HOME画面だけ、右上に出す */
  #helpBtn{position:absolute;right:12px;top:12px;z-index:7;pointer-events:auto;
    width:40px;height:40px;border-radius:50%;border:0;background:rgba(38,36,31,.4);box-shadow:var(--shadow);
    font-size:16px;font-weight:700;color:#fff;cursor:pointer;display:none;align-items:center;justify-content:center}
  #helpBtn:active{transform:translateY(1px)}

  /* 正方形のゲージが、タップで長方形に伸びて中に操作を出す */
  #focusGauge{display:none;position:absolute;right:14px;bottom:14px;
    width:112px;height:112px;flex-direction:column;align-items:stretch;
    pointer-events:auto;cursor:pointer;z-index:6;overflow:hidden;
    background:rgba(38,36,31,.42);border-radius:26px;box-shadow:var(--shadow);
    transition:width .28s cubic-bezier(.22,.8,.28,1),height .28s cubic-bezier(.22,.8,.28,1),border-radius .28s;}
  #ui.screen-focus #focusGauge{display:flex}
  #focusGauge.open{width:236px;height:280px;border-radius:26px;cursor:default}
  #focusGauge .gwrap{position:relative;width:112px;height:112px;flex:none;align-self:center}
  #gaugeSvg{width:112px;height:112px;display:block}
  #gaugeSvg rect{fill:none;stroke-width:8;stroke-linecap:round;paint-order:stroke}
  #gaugeBg{stroke:rgba(255,255,255,.4)}
  #gaugeFg{stroke:var(--mint);transition:stroke-dashoffset .25s linear}
  #focusGauge.paused #gaugeFg{stroke:var(--sun)}
  #gaugeTime{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:#fff;
    text-shadow:0 2px 6px rgba(0,0,0,.4);letter-spacing:.01em;pointer-events:none}

  #focusMenu{display:none;flex-direction:column;gap:7px;padding:8px 10px 10px;pointer-events:auto}
  #focusGauge.open #focusMenu{display:flex}
  #focusMenu .btn{width:100%}

  /* 「やめる」長押し確定 */
  #bQuit{position:relative;overflow:hidden}
  #bQuit .holdRing{position:absolute;inset:0;border-radius:12px;
    background:conic-gradient(var(--coral) calc(var(--hold,0)*1%), transparent 0);
    opacity:.55;pointer-events:none}
  #bQuit span{position:relative}

  #lenPick{display:none}

  /* ===== 時間選択画面 ===== */
  #pickCtrl{margin-bottom:9px}
  #pickTop{display:flex;align-items:center;gap:8px}
  #pickCard{flex:1;text-align:center;padding:14px 12px}
  #pickTime{font-size:46px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
  #pickTotal{font-size:11px;color:var(--ink-soft);font-weight:700;margin-top:2px}
  #pickSliderWrap{padding:6px 4px 2px}
  #pickSlider{width:100%;-webkit-appearance:none;appearance:none;height:8px;border-radius:999px;
    background:#F0EBE2;outline:none;margin:10px 0 4px;position:relative}
  #pickSlider::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;
    background:#fff;border:3px solid var(--coral);box-shadow:0 2px 6px rgba(63,58,52,.3);cursor:pointer}
  #pickSlider::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;
    border:3px solid var(--coral);box-shadow:0 2px 6px rgba(63,58,52,.3);cursor:pointer}
  #pickTicks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-soft);font-weight:700;padding:0 2px}
  #pickSug{position:relative;height:4px;margin:0 11px}
  #pickSugDot{position:absolute;top:-3px;width:10px;height:10px;border-radius:50%;background:var(--sky);
    border:2px solid #fff;box-shadow:0 1px 3px rgba(63,58,52,.3);transform:translateX(-50%)}
  #pickTagLabel{font-size:11px;font-weight:700;color:var(--ink-soft);margin:12px 0 6px}
  #pickTags{display:flex;gap:8px;flex-wrap:wrap}
  #pickTags button{border:0;border-radius:999px;min-height:48px;padding:13px 22px;font-family:inherit;font-weight:700;
    font-size:15px;background:#F3EFE8;color:var(--ink-soft);cursor:pointer;transition:.16s}
  #pickTags button[aria-pressed="true"]{background:var(--coral);color:#fff}

  #stageName{cursor:pointer;-webkit-user-select:none;user-select:none}
  .seg{display:flex;background:#F3EFE8;border-radius:11px;padding:2px;gap:2px;flex:1}
  .seg button{flex:1;border:0;background:transparent;border-radius:9px;min-height:40px;padding:9px 0;font-family:inherit;
    font-weight:700;font-size:13px;color:var(--ink-soft);cursor:pointer;transition:.16s}
  .seg button[aria-pressed="true"]{background:var(--sun);color:#6B4A00;box-shadow:0 2px 0 rgba(180,130,10,.28)}
  #say{position:relative;padding:16px 20px;min-height:64px;display:flex;align-items:center}
  #sayName{display:inline-block;font-size:12px;font-weight:700;color:#B24E30;background:#FFE7DE;
    padding:4px 10px;border-radius:999px;margin-bottom:5px}
  #sayText{font-size:16px;line-height:1.55}
  #say.quiet #sayText{color:var(--ink-soft);font-size:15px}
  #sayPick.quiet #sayTextPick{color:var(--ink-soft)}
  #ctrl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:9px}
  .btn{border:0;border-radius:16px;min-height:52px;padding:14px 8px;font-family:inherit;font-weight:700;font-size:15px;
    background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 rgba(63,58,52,.14);transition:transform .1s,box-shadow .1s}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(63,58,52,.14)}
  .btn.primary{grid-column:span 3;background:var(--coral);color:#fff;box-shadow:0 4px 0 #D9603F;font-size:20px;min-height:68px;padding:18px 8px}
  .btn.primary:active{box-shadow:0 1px 0 #D9603F}
  .btn.sky{background:var(--sky);color:#0C4E66;box-shadow:0 3px 0 #3EA6C9}
  .btn.sky:active{box-shadow:0 1px 0 #3EA6C9}
  .btn.plain{background:#F3EFE8;color:var(--ink-soft);box-shadow:0 3px 0 rgba(63,58,52,.10)}
  .btn:disabled{opacity:.34;cursor:default;transform:none}
  .btn:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
  #dayQ{padding:9px 13px;display:flex;flex-direction:column;gap:8px;margin-top:0}
  #dqText{font-size:12.5px;font-weight:700}
  #dqBtns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  #coin{position:absolute;left:50%;top:44%;transform:translateX(-50%);font-size:21px;font-weight:700;
    color:#B27A18;text-shadow:0 2px 0 #fff;opacity:0;pointer-events:none}
  #coin.go{animation:rise 1.5s ease-out}
  @keyframes rise{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-50px)}}

  /* ===== タイトル画面（起動時のオーバーレイ、STARTでホームへ） ===== */
  #ttFrame{position:absolute;inset:0;z-index:40;overflow:hidden;
    background:linear-gradient(180deg,#6FB9E4 0%,#A6DCEF 28%,#FFE3B8 42%);
    transition:opacity .5s ease}
  #ttFrame.tt-hide{opacity:0;pointer-events:none}
  #ttRays{position:absolute;left:50%;top:28%;width:250%;aspect-ratio:1;transform:translate(-50%,-50%);
    background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.26) 0deg 5deg,rgba(255,255,255,0) 5deg 14deg);
    -webkit-mask-image:radial-gradient(circle,rgba(0,0,0,.24) 0%,#000 24%,rgba(0,0,0,.46) 46%,transparent 74%);
    mask-image:radial-gradient(circle,rgba(0,0,0,.24) 0%,#000 24%,rgba(0,0,0,.46) 46%,transparent 74%);
    animation:ttSpin 90s linear infinite;pointer-events:none}
  @keyframes ttSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  .tt-cloud{position:absolute;background:rgba(255,255,255,.9);border-radius:999px;pointer-events:none}
  .tt-cloud::before,.tt-cloud::after{content:"";position:absolute;background:inherit;border-radius:999px}
  #ttC1{left:-8%;top:5%;width:34%;height:4.2%;opacity:.75;animation:ttDrift 46s linear infinite}
  #ttC1::before{width:52%;height:150%;left:16%;top:-72%}
  #ttC1::after{width:34%;height:120%;left:56%;top:-52%}
  #ttC2{right:-10%;top:30%;width:36%;height:3.8%;opacity:.55;animation:ttDrift 62s linear infinite reverse}
  #ttC2::before{width:46%;height:145%;left:22%;top:-70%}
  #ttC2::after{width:30%;height:112%;left:8%;top:-46%}
  @keyframes ttDrift{from{transform:translateX(-14%)}to{transform:translateX(14%)}}
  #ttLand{position:absolute;left:-16%;right:-16%;top:38%;bottom:-6%;
    background:radial-gradient(120% 78% at 50% 0%,#9BC271 0%,#82AD5C 52%,#6B944A 100%);
    border-radius:50% 50% 0 0 / 22% 22% 0 0;pointer-events:none}
  #ttLandShade{position:absolute;left:-16%;right:-16%;top:38%;bottom:-6%;
    background:radial-gradient(60% 26% at 22% 32%,rgba(255,255,255,.16),transparent 70%),
      radial-gradient(52% 22% at 78% 50%,rgba(255,255,255,.12),transparent 70%),
      linear-gradient(180deg,rgba(255,255,255,.14) 0%,transparent 26%,rgba(50,70,36,.16) 100%);
    border-radius:50% 50% 0 0 / 22% 22% 0 0;pointer-events:none}
  #ttLandEdge{position:absolute;left:-16%;right:-16%;top:38%;height:14%;
    border-radius:50% 50% 0 0 / 62% 62% 0 0;box-shadow:inset 0 7px 0 rgba(255,255,255,.26);pointer-events:none}
  .tt-tuft{position:absolute;pointer-events:none;border-radius:60% 60% 40% 40%/90% 90% 12% 12%;background:#6B944A}
  #ttStage{position:absolute;inset:0}
  #ttStage canvas{display:block}
  #ttLogo{position:absolute;left:0;right:0;top:6%;display:flex;flex-direction:column;align-items:center;gap:2px;
    pointer-events:none;z-index:3;animation:ttLogoIn .85s cubic-bezier(.2,1.5,.5,1) both}
  @keyframes ttLogoIn{from{transform:translateY(-10px) scale(.9)}to{transform:none}}
  #ttLogoMain{width:min(102%,470px);height:auto;display:block;
    filter:drop-shadow(0 9px 0 rgba(90,62,0,.24)) drop-shadow(0 14px 26px rgba(31,53,66,.36))}
  #ttLogoSub{width:min(94%,400px);height:auto;display:block;margin-top:-2px;
    filter:drop-shadow(0 3px 0 rgba(90,62,0,.28)) drop-shadow(0 6px 14px rgba(31,53,66,.3))}
  #ttStart{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);
    font-family:"Outfit","Zen Maru Gothic",system-ui,sans-serif;font-weight:700;
    font-size:clamp(22px,6.6vw,31px);letter-spacing:.16em;color:#fff;background:#FF8A6B;
    border:0;border-radius:999px;padding:18px 62px 18px 70px;cursor:pointer;
    box-shadow:0 6px 0 #D9603F,0 14px 30px rgba(31,53,66,.36);z-index:3;animation:ttBreathe 2.6s ease-in-out infinite}
  #ttStart:active{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 #D9603F,0 8px 18px rgba(31,53,66,.3)}
  #ttStart:focus-visible{outline:3px solid #fff;outline-offset:4px}
  @keyframes ttBreathe{0%,100%{transform:translateX(-50%)}50%{transform:translateX(-50%) translateY(-4px)}}
  @media (prefers-reduced-motion:reduce){#ttRays,#ttC1,#ttC2,#ttLogo,#ttStart{animation:none}}
</style>
</head>
<body>
<div id="phone">
  <div id="ttFrame">
    <div id="ttRays"></div>
    <div class="tt-cloud" id="ttC1"></div>
    <div class="tt-cloud" id="ttC2"></div>
    <div id="ttLand"></div>
    <div id="ttLandShade"></div>
    <div id="ttLandEdge"></div>
    <div id="ttStage"></div>

    <div id="ttLogo">
      <svg id="ttLogoMain" viewBox="0 0 400 128" aria-label="OjiMate">
        <defs>
          <linearGradient id="ttShine" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFEFB8"/>
            <stop offset="50%" stop-color="#FFC64B"/>
            <stop offset="100%" stop-color="#EE9C24"/>
          </linearGradient>
        </defs>
        <g transform="scale(1,1.2)">
          <text x="200" y="74" text-anchor="middle"
                font-family="Zen Maru Gothic, sans-serif" font-size="90" font-weight="700"
                paint-order="stroke" stroke="#5A3E00" stroke-width="24" stroke-linejoin="round"
                fill="#FFC64B">OjiMate</text>
          <text x="200" y="74" text-anchor="middle"
                font-family="Zen Maru Gothic, sans-serif" font-size="90" font-weight="700"
                fill="url(#ttShine)">OjiMate</text>
        </g>
      </svg>
      <svg id="ttLogoSub" viewBox="0 0 470 60" aria-label="おぢさんと一蓮托生">
        <text x="235" y="43" text-anchor="middle"
              font-family="Zen Maru Gothic, sans-serif" font-size="41" font-weight="700"
              paint-order="stroke" stroke="#5A3E00" stroke-width="12" stroke-linejoin="round"
              fill="#FFF4DC">～おぢさんと一蓮托生～</text>
      </svg>
    </div>

    <button id="ttStart" type="button">START</button>
  </div>
  <div id="stage"></div>
  <div id="coin"></div>
  <button id="backBtn" aria-label="戻る">←</button>
  <button id="helpBtn" aria-label="使い方をもう一度見る">?</button>
  <div id="tapHint">家をタップすると今の状況が見られます</div>

// ===== 記憶（localStorage） =====
// 関係は数値としてユーザーには見せず、口調や踏み込み方だけで伝える。
// ここで積むのは「減らない」指標だけ：会った量（親しさ）と約束を守った量（信頼）。
const STORE_KEY='ojimate_memory_v1';
function todayStr(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function defaultStore(){
  return {
    firstVisitDay:null, lastVisitDay:null,
    totalDays:0, completedSessions:0, interruptedSessions:0, totalFocusMin:0,
    recent:[], // 直近の完走/中断の履歴（傾向判定用、古いものから捨てる）
    lastQuestionDay:null, todayAnswer:null, // 'tough' | 'ok'
    money:0, stageIdx:0,
    lastSessionMin:50,
    tutorialHome:false, tutorialFocus:false, tutorialIntro:false, // 初回だけのチュートリアル表示を出したかどうか
    ojiMateNightSessions:0,
    agentEndpoint:'', agentSecret:'', // おじさんのセリフをAIに読ませたい人だけ設定するプロキシ（worker/参照）
  };
}
function loadStore(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw){ const parsed=JSON.parse(raw); return Object.assign(defaultStore(), parsed); }
  }catch(e){}
  return defaultStore();
}
function saveStore(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){} }
const store=loadStore();
SESSION_MIN=store.lastSessionMin||50; SESSION_SEC=SESSION_MIN*DEMO_SEC_PER_MIN;

function daysSinceLastVisit(){
  if(!store.lastVisitDay) return 0;
  const a=new Date(store.lastVisitDay+'T00:00:00'), b=new Date(todayStr()+'T00:00:00');
  return Math.max(0, Math.round((b-a)/86400000));
}
let visitAbsence=0; // 起動時点の空白日数（訪問記録の前に確定させておく）
function recordVisit(){
  visitAbsence=daysSinceLastVisit();
  const t=todayStr();
  if(store.lastVisitDay!==t){ store.totalDays+=1; store.lastVisitDay=t; }
  if(!store.firstVisitDay) store.firstVisitDay=t;
  saveStore();
}
function closenessTier(){ // 0:初日 1:顔なじみ 2:長い付き合い
  if(store.totalDays>=15) return 2;
  if(store.totalDays>=3) return 1;
  return 0;
}
function trustTier(){ // 0:様子見 1:信頼あり 2:厚い信頼（積み上がる一方、下げない）
  if(store.completedSessions>=8) return 2;
  if(store.completedSessions>=2) return 1;
  return 0;
}
function recentBadStreak(){ // 直近の中断続き（信頼の到達値は下げず、その日の口調と提案だけ和らげる）
  let n=0;
  for(let i=store.recent.length-1;i>=0;i--){
    if(store.recent[i].ok) break; n++;
  }
  return n;
}
function isLateNight(){ const h=new Date().getHours(); return h>=0&&h<5; }
function recordSessionOutcome(ok,min){

  store.totalFocusMin+=min;

  if(store.recent.length>12) store.recent.shift();
  if(isLateNight()) store.ojiMateNightSessions+=1;
  saveStore();
}
function suggestedMinutes(){

}

// ポリゴン多め
const mat=c=>new THREE.MeshLambertMaterial({color:c});
function box(w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d,5,5,5),mat(c));m.castShadow=true;m.receiveShadow=true;return m;}
function cyl(rt,rb,h,c,s=48){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,s,4),mat(c));m.castShadow=true;m.receiveShadow=true;return m;}
function sph(r,c,s=56){const m=new THREE.Mesh(new THREE.SphereGeometry(r,s,Math.round(s*0.75)),mat(c));m.castShadow=true;m.receiveShadow=true;return m;}

function put(p,m,x,y,z){m.position.set(x,y,z);p.add(m);return m;}

// ===== 地面 =====

let envGroup=null;
// ===== 時間帯と天気 =====
// 開くたびに同じ画面にしない。実時間の時間帯で光を変え、日ごとに天気を決める。
function timePhase(){
  const h=new Date().getHours();
  if(h>=5&&h<9)  return 'dawn';
  if(h>=9&&h<16) return 'day';
  if(h>=16&&h<19)return 'dusk';
  return 'night';
}
// 天気は日付から決定的に決める（同じ日に開き直しても変わらない）
function todayWeather(){
  const d=new Date(); const seed=(d.getFullYear()*372+d.getMonth()*31+d.getDate());
  const r=((seed*9301+49297)%233280)/233280;
  return r<0.25?'rain':'clear';
}
const PHASE={
  dawn :{sky:0xE9C9A8, sun:0xFFE0B4, si:0.52, hemiS:0xEBD6C4, hemiG:0x8A8A66, hi:0.55, fill:0.12},
  day  :{sky:0xA9D3E2, sun:0xFFF2DC, si:0.62, hemiS:0xCFE2EC, hemiG:0x6F8A56, hi:0.58, fill:0.15},
  dusk :{sky:0xE2A583, sun:0xFFC98A, si:0.42, hemiS:0xE4C0AA, hemiG:0x7A7458, hi:0.46, fill:0.14},
  night:{sky:0x3E4E68, sun:0xC7D8F0, si:0.34, hemiS:0x5C7090, hemiG:0x3A465C, hi:0.50, fill:0.20}
};
let curPhase='day', curWeather='clear';
function updateSky(idx){
  curPhase=timePhase(); curWeather=todayWeather();
  const p=PHASE[curPhase];
  let sky=p.sky;
  if(idx===0) sky=mixHex(sky,0x9E9A8E,0.45);      // スラム段階はくすませる
  if(curWeather==='rain') sky=mixHex(sky,0x8A93A0,0.55);
  scene.background.setHex(sky); scene.fog.color.setHex(sky);
  sun.color.setHex(p.sun);
  sun.intensity=p.si*(curWeather==='rain'?0.55:1);
  hemi.color.setHex(p.hemiS); hemi.groundColor.setHex(p.hemiG);
  hemi.intensity=p.hi*(curWeather==='rain'?0.85:1);
  fill.intensity=p.fill;
  setRain(curWeather==='rain');
  setWindowGlow(curPhase==='night'||curPhase==='dusk'||curWeather==='rain');
}
function mixHex(a,b,k){
  const ar=(a>>16)&255,ag=(a>>8)&255,ab=a&255, br=(b>>16)&255,bg=(b>>8)&255,bb=b&255;
  return (Math.round(ar+(br-ar)*k)<<16)|(Math.round(ag+(bg-ag)*k)<<8)|Math.round(ab+(bb-ab)*k);
}
function buildEnv(idx){

    // 錆びて乗り捨てられた車とスクールバス

function roundWindow(g,x,y,z,r,frameColor){
  const fc=frameColor||C.trim;

  glassDisc.position.set(x,y,z); glassDisc.receiveShadow=true; g.add(glassDisc);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(r*0.82,r*0.17,10,28), mat(fc));
  ring.position.set(x,y,z); ring.castShadow=true; g.add(ring);
  put(g,box(r*1.5,0.018,0.018,fc),x,y,z+0.01);
  put(g,box(0.018,r*1.5,0.018,fc),x,y,z+0.01);
}

function flowerBox(g,x,y,z,w){
  put(g,box(w,0.1,0.13,C.woodOld),x,y,z);
  const cols=[0xE8845E,0xF3D06A,0xE8A0BE,0xFFFFFF];

    return choice(['こんな時間か。長丁場はやめて、切り上げやすい時間にしとこ。','夜遅いしな。今日は短めにしとくか。']);
  if(!last)

// ===== AIエージェント（任意設定）=====
// トガメと同じ構成：APIキーをブラウザに置けないので、Cloudflare Worker等の
// プロキシを自分で立てて住所と合言葉をここに入れる（worker/ を参照）。
// 未設定ならローカルのセリフ（pickIdleLine/pickTimeLine等）だけで動く。
async function askAgent({ system, user, onDelta }){
  if(!store.agentEndpoint) return null;
  const res=await fetch(store.agentEndpoint,{
    method:'POST',
    headers:{ 'content-type':'application/json', 'x-ojimate-key': store.agentSecret||'' },
    body: JSON.stringify({ system, user }),
  });
  if(!res.ok) throw new Error((await res.text()).slice(0,300)||String(res.status));
  const reader=res.body.getReader(), dec=new TextDecoder();
  let buf='', out='';
  for(;;){
    const {value,done}=await reader.read();
    if(done) break;
    buf+=dec.decode(value,{stream:true});
    const lines=buf.split('\n'); buf=lines.pop();
    for(const line of lines){
      if(!line.startsWith('data:')) continue;
      let ev; try{ ev=JSON.parse(line.slice(5).trim()); }catch(e){ continue; }
      if(ev.type==='content_block_delta'&&ev.delta&&ev.delta.type==='text_delta'){
        out+=ev.delta.text; if(onDelta) onDelta(ev.delta.text,out);
      }
    }
  }
  return out.trim();
}

// ===== 音（コードで合成。外部音源は使わない） =====
let audioCtx=null, master=null, droneOsc=[], windGainNode=null, guitarGain=null;
function ensureAudio(){
  if(audioCtx) return;
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  master=audioCtx.createGain(); master.gain.value=0; master.connect(audioCtx.destination);
  const bufSize=audioCtx.sampleRate*2;
  const buf=audioCtx.createBuffer(1,bufSize,audioCtx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) data[i]=Math.random()*2-1;
  const noise=audioCtx.createBufferSource(); noise.buffer=buf; noise.loop=true;
  const windFilter=audioCtx.createBiquadFilter(); windFilter.type='bandpass'; windFilter.frequency.value=420; windFilter.Q.value=0.5;
  windGainNode=audioCtx.createGain(); windGainNode.gain.value=0.03;
  noise.connect(windFilter).connect(windGainNode).connect(master); noise.start();
  [55,82.5].forEach((f,i)=>{
    const o=audioCtx.createOscillator(); o.type='sine'; o.frequency.value=f;
    const g=audioCtx.createGain(); g.gain.value=i===0?0.03:0.012;
    o.connect(g).connect(master); o.start(); droneOsc.push(o);
  });
  guitarGain=audioCtx.createGain(); guitarGain.gain.value=1; guitarGain.connect(master);
}

// カフェ風の指弾きアコースティックギター（コード進行を爪弾くループ、外部音源なし）
const GUITAR_CHORDS=[
  [261.63,329.63,392.00,493.88], // Cmaj7: C4 E4 G4 B4
  [220.00,261.63,329.63,392.00], // Am7:   A3 C4 E4 G4
  [174.61,220.00,261.63,329.63], // Fmaj7: F3 A3 C4 E4
  [196.00,246.94,293.66,349.23], // Gadd9-ish: G3 B3 D4 F4
];
const PICK_PATTERN=[0,2,1,3,2,1];
const NOTE_GAP=0.44;
let guitarStep=0, guitarChordIdx=0, nextNoteTime=0, guitarTimer=null;
function pluckNote(freq,t,vel){
  const o=audioCtx.createOscillator(); o.type='triangle'; o.frequency.value=freq;
  const o2=audioCtx.createOscillator(); o2.type='sawtooth'; o2.frequency.value=freq*2.006; // わずかにデチューンした倍音でギターの艶を足す
  const filt=audioCtx.createBiquadFilter(); filt.type='lowpass'; filt.Q.value=0.7;
  filt.frequency.setValueAtTime(3400,t); filt.frequency.exponentialRampToValueAtTime(380,t+1.5);
  const g=audioCtx.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vel,t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,t+1.6);
  const g2=audioCtx.createGain(); g2.gain.value=0.16;
  o.connect(filt); o2.connect(g2).connect(filt);
  filt.connect(g).connect(guitarGain);
  o.start(t); o.stop(t+1.7); o2.start(t); o2.stop(t+1.7);
}
function scheduleGuitar(){
  while(nextNoteTime<audioCtx.currentTime+0.2){
    const chord=GUITAR_CHORDS[guitarChordIdx];
    const idx=PICK_PATTERN[guitarStep%PICK_PATTERN.length];
    pluckNote(chord[idx],nextNoteTime,idx===0?0.075:0.05);
    nextNoteTime+=NOTE_GAP;
    guitarStep++;
    if(guitarStep%PICK_PATTERN.length===0) guitarChordIdx=(guitarChordIdx+1)%GUITAR_CHORDS.length;
  }
}
function startMusic(){
  ensureAudio(); audioCtx.resume();
  master.gain.cancelScheduledValues(audioCtx.currentTime);
  master.gain.linearRampToValueAtTime(1,audioCtx.currentTime+1.2);
  if(!guitarTimer){
    nextNoteTime=audioCtx.currentTime+0.3; guitarStep=0; guitarChordIdx=0;
    guitarTimer=setInterval(scheduleGuitar,100);
  }
}
function stopMusic(){
  if(!audioCtx) return;
  master.gain.cancelScheduledValues(audioCtx.currentTime);
  master.gain.linearRampToValueAtTime(0,audioCtx.currentTime+0.8);
  if(guitarTimer){ clearInterval(guitarTimer); guitarTimer=null; }
}
function playKeyClick(){
  if(!audioCtx) return;
  const tt=audioCtx.currentTime;
  const o=audioCtx.createOscillator(); o.type='square'; o.frequency.value=1700+Math.random()*700;
  const g=audioCtx.createGain();
  o.connect(g).connect(master);
  g.gain.setValueAtTime(0.0001,tt);
  g.gain.exponentialRampToValueAtTime(0.05,tt+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001,tt+0.04);
  o.start(tt); o.stop(tt+0.05);
}

function tryHouseTap(clientX,clientY){
  if(uiScreen!=='HOME') return false;
  const rect=cv.getBoundingClientRect();
  let hit=false;
  if(houseGroup){
    const ndc=new THREE.Vector2(((clientX-rect.left)/rect.width)*2-1, -((clientY-rect.top)/rect.height)*2+1);
    raycaster.setFromCamera(ndc,camera);
    hit = raycaster.intersectObject(houseGroup,true).length>0;
  }
  if(!hit){
    // 3Dの厳密な当たり判定は視点や手前の小物の重なりでシビアになりがち。
    // 家がだいたい映っている中央帯はフォールバックとしても「家をタップ」扱いにし、
    // 「押したのに何も出ない」を防ぐ
    const nx=(clientX-rect.left)/rect.width, ny=(clientY-rect.top)/rect.height;
    hit = nx>0.12 && nx<0.88 && ny>0.2 && ny<0.68;
  }
  if(hit){ toggleInfo(); return true; }
  toggleInfo(false); // 家以外をタップしたら閉じる
  return false;
}

function tutPositionAround(el){
  const pr=phone.getBoundingClientRect(), r=el.getBoundingClientRect(), pad=10;
  const hole={
    left: Math.max(0,r.left-pr.left-pad), top: Math.max(0,r.top-pr.top-pad),
    right: Math.min(pr.width,r.right-pr.left+pad), bottom: Math.min(pr.height,r.bottom-pr.top+pad),
  };
  const pw=pr.width, ph=pr.height;
  tutHoleEl.style.left=hole.left+'px'; tutHoleEl.style.top=hole.top+'px';
  tutHoleEl.style.width=(hole.right-hole.left)+'px'; tutHoleEl.style.height=(hole.bottom-hole.top)+'px';
  tutBars.t.style.cssText=`left:0;top:0;width:${pw}px;height:${hole.top}px`;
  tutBars.b.style.cssText=`left:0;top:${hole.bottom}px;width:${pw}px;height:${Math.max(0,ph-hole.bottom)}px`;
  tutBars.l.style.cssText=`left:0;top:${hole.top}px;width:${hole.left}px;height:${hole.bottom-hole.top}px`;
  tutBars.r.style.cssText=`left:${hole.right}px;top:${hole.top}px;width:${Math.max(0,pw-hole.right)}px;height:${hole.bottom-hole.top}px`;
  const calloutW=210, calloutH=Math.min(150,ph*0.24);
  const top=(hole.bottom+16+calloutH<ph) ? hole.bottom+16 : Math.max(12,hole.top-16-calloutH);
  const left=Math.max(12,Math.min((hole.left+hole.right)/2-calloutW/2, pw-12-calloutW));
  tutCalloutEl.style.left=left+'px'; tutCalloutEl.style.top=top+'px';
}

    tutBars.b.style.cssText='width:0;height:0'; tutBars.l.style.cssText='width:0;height:0'; tutBars.r.style.cssText='width:0;height:0';
    tutCalloutEl.className='center';
    tutCalloutEl.style.left=(pr.width/2-120)+'px'; tutCalloutEl.style.top=(pr.height/2-95)+'px';
    tutCalloutEl.innerHTML='<div class="tut-emoji">🎉</div>お疲れ様！<br>この調子でおじさんと一緒に続けていこう。<button class="btn primary" id="tutDone">閉じる</button>';
    document.getElementById('tutDone').addEventListener('click', tutClose);
    return;
  }
  tutTargetEl = key==='home'?bStart : key==='pick'?bPickStart : focusGaugeEl;
  tutCalloutEl.className='';
  tutCalloutEl.innerHTML=TUTORIAL_STEPS[key];
  tutHoleEl.style.opacity='1';
  tutHoleEl.classList.add('pulse');
  tutPositionAround(tutTargetEl);
  if(tutRAF) cancelAnimationFrame(tutRAF);
  tutRAF=requestAnimationFrame(tutLoop);
}
function tutClose(){
  tutActive=false; tutStepKey=null; tutTargetEl=null;
  if(tutRAF){ cancelAnimationFrame(tutRAF); tutRAF=null; }
  tutOverlayEl.classList.remove('show');
  store.tutorialIntro=true; saveStore();
}
document.getElementById('tutSkip').addEventListener('click', tutClose);
function showIntroTutorial(){

// 右上の「?」からは、既に見ていても何度でも見返せる
document.getElementById('helpBtn').addEventListener('click', ()=>{
  if(uiScreen!=='HOME'||state!=='IDLE') return;
  store.tutorialIntro=false;
  showIntroTutorial();
});

const clock=new THREE.Clock();
function tick(){
  const dt=Math.min(0.05,clock.getDelta()), t=clock.elapsedTime;
  poseT+=dt;

  if(state==='FOCUS'&&!confirmingQuit){
    sTime+=dt;
    const p=Math.min(1,sTime/SESSION_SEC);
    gaugeFg.style.strokeDashoffset=GP*(1-p);
    const rem=Math.max(0,SESSION_MIN*60*(1-p));
    gaugeTime.textContent=String(Math.floor(rem/60)).padStart(2,'0')+':'+String(Math.floor(rem%60)).padStart(2,'0');
    if(p>=1) endSession(true);
  }
  if(camTween){
    camTween.t+=dt;
    const k=Math.min(1,camTween.t/camTween.dur), e=1-Math.pow(1-k,3);
    az=lerp(camTween.from.az,camTween.to.az,e);
    el=lerp(camTween.from.el,camTween.to.el,e);
    zoom=lerp(camTween.from.zoom,camTween.to.zoom,e);
    lookX=lerp(camTween.from.lx,camTween.to.lx,e);
    lookY=lerp(camTween.from.ly,camTween.to.ly,e);
    lookZ=lerp(camTween.from.lz,camTween.to.lz,e);
    updCam();
    if(k>=1) camTween=null;
  }
  if(!confirmingQuit&&(state==='IDLE'||state==='NUDGE'||state==='PAUSED')){
    decayT+=dt*(state==='NUDGE'?4:state==='PAUSED'?0.3:1);
    for(let i=SLACK.length-1;i>=0;i--){
      if(decayT>=SLACK[i].at&&decayLv<i+1){decayLv=i+1;sayRaw(SLACK[i].line);act=null;break;}
    }
  }
  cig.visible=decayLv===5;
  phoneProp.visible=decayLv===3;
  chips.visible=decayLv>=6;

  const dx=wp.x-man.position.x, dz=wp.z-man.position.z, d2=Math.hypot(dx,dz);
  if(confirmingQuit||decayLv>=1) waitT=99;
  if(waitT>0){
    waitT-=dt; walking=false;
    if(act){ actT+=dt; if(actT>actDur) act=null; }
  } else if(d2>0.18){
    walking=true; act=null;
    const sp=(state==='IDLE')?0.85:1.5;
    man.position.x+=dx/d2*Math.min(d2,sp*dt);
    man.position.z+=dz/d2*Math.min(d2,sp*dt);
    yawTarget=Math.atan2(dx,dz);
  } else {
    walking=false;
    if(state==='IDLE'&&decayLv===0&&uiScreen!=='PICK'){waitT=3.0+Math.random()*3.0;newWaypoint();pickAct();}
  }

  const atDesk=(state==='FOCUS')&&!walking&&d2<=0.3&&decayLv===0;
  sitAmt+=(((atDesk||decayLv===5)?1:0)-sitAmt)*Math.min(1,dt*4);
  lieAmt+=(((decayLv>=6)?1:0)-lieAmt)*Math.min(1,dt*2.5);
  const introing=uiEl.classList.contains('intro');
  if(confirmingQuit||decayLv>=1||atDesk||introing||(uiScreen==='PICK'&&!walking)) yawTarget=0;
  let dy=yawTarget-man.rotation.y;
  while(dy>Math.PI)dy-=Math.PI*2; while(dy<-Math.PI)dy+=Math.PI*2;
  man.rotation.y+=dy*Math.min(1,dt*5);

  const step=Math.sin(poseT*4.6);
  let bz=walking?step*0.10:0;
  let by=walking?Math.abs(step)*0.05:Math.sin(poseT*1.4)*0.015;
  let lean=0;
  let hx=headUp, hy=Math.sin(t*0.4)*0.09;
  let Lx=walking?step*0.30:0.02, Rx=walking?-step*0.30:0.02;
  let Lz=0.26, Rz=-0.26, Lf=-0.25, Rf=-0.25, k=6;
  mouth.scale.set(1,1,1);

  if(confirmingQuit){
    // 手を止めてこちらを向く。責める素振りはさせない（腕は力を抜いた自然な位置）
    Lx=-0.30; Rx=-0.30; Lz=0.20; Rz=-0.20; Lf=-0.30; Rf=-0.30; hx=-0.03+Math.sin(t*1.6)*0.02; k=8;
  } else if(atDesk&&state==='FOCUS'){
    // 二段折り：上腕はほぼ垂直のまま、肘を深く曲げて前腕だけを机の上に伸ばす
    const tap=Math.sin(poseT*13)*0.14, tap2=Math.sin(poseT*13+1.9)*0.14;
    Lx=-0.30+tap*0.3; Rx=-0.30+tap2*0.3; Lz=0.28; Rz=-0.28; Lf=-1.65+tap; Rf=-1.65+tap2;
    lean=0.18; hx=0.22; hy=-0.12; k=10;
    if(t>nextClickT){ playKeyClick(); nextClickT=t+0.08+Math.random()*0.16; }
  } else if(decayLv===1){
    const c=poseT%4.2;
    if(c<1.3){const e=Math.sin(c/1.3*Math.PI);
      hx=-0.5*e; Rx=-2.3*e; Rz=-0.5-0.5*e; Rf=-0.6*e; Lx=-1.5*e; Lz=0.4+0.4*e; Lf=-0.5*e;
      mouth.scale.set(1,1+e*7,1+e*4);}
    k=5;
  } else if(decayLv===2){
    Rx=-2.4; Rz=-0.7; Rf=-1.5+Math.sin(poseT*13)*0.16; Lx=0.05; hx=0.12; bz=Math.sin(poseT*2)*0.03; k=8;
  } else if(decayLv===3){
    Lx=-1.15; Lz=0.5; Lf=-0.9; Rx=-1.05; Rz=-0.45; Rf=-0.95; hx=0.42; hy=Math.sin(t*0.6)*0.04;
    phoneScr.material.color.setHSL(0.55,0.5,0.68+Math.sin(t*7)*0.05);
  } else if(decayLv===4){
    const s2=Math.sin(poseT*3.4);
    bz=s2*0.26; by=Math.abs(s2)*0.09; hy=s2*0.3;
    Lx=-1.7+s2*0.35; Rx=-1.7-s2*0.35; Lz=0.8; Rz=-0.8; Lf=-1.1; Rf=-1.1; hx=-0.1;
  } else if(decayLv===5){
    const c=poseT%5.5, toM=c<1.1?Math.sin(c/1.1*Math.PI):0;
    Rx=-0.5-0.5*toM; Rz=-0.3-0.2*toM; Rf=-0.7-1.1*toM; Lx=-0.15; Lz=0.5; Lf=-0.5; hx=0.05; k=5;
  } else if(decayLv>=6){
    const c=poseT%2.4, eat=c<1.0?Math.sin(c/1.0*Math.PI):0;
    Lx=-0.5; Lz=0.65; Lf=-0.8; Rx=-0.4-0.7*eat; Rz=-0.5; Rf=-0.6-1.3*eat; hx=0.1;
    mouth.scale.set(1,1+eat*4,1+eat*2); k=6;
  } else if(state==='NUDGE'){
    Lx=-0.5; Rx=-0.5; Lf=-0.3; Rf=-0.3; hx=-0.1;
  } else if(act){
    const u=actT/actDur, e=Math.sin(u*Math.PI);
    if(act==='look'){ hy=Math.sin(actT*1.7)*0.6; hx=-0.05; }
    else if(act==='stretch'){ Lx=-2.5*e; Rx=-2.5*e; Lz=0.35+0.3*e; Rz=-0.35-0.3*e; Lf=-0.2; Rf=-0.2;
      hx=-0.32*e; lean=-0.16*e; by+=0.05*e; }
    else if(act==='scratch'){ Rx=-0.4; Rz=-0.1; Rf=-1.45+Math.sin(actT*11)*0.14; hx=0.16; }
    else if(act==='ponder'){ Lx=-0.95; Lz=0.75; Lf=-1.5; Rx=-0.95; Rz=-0.75; Rf=-1.5;
      hx=0.2; hy=Math.sin(actT*0.8)*0.18; }
    else if(act==='pocket'){ const late=u>0.7;
      if(late){ Lx=-0.5; Rx=-0.5; Lz=0.85; Rz=-0.85; Lf=-0.3; Rf=-0.3; hx=-0.12; }
      else { Rx=-0.15; Rf=-0.75+Math.sin(actT*9)*0.18; Lx=-0.1; Lf=-0.7; hx=0.22; } }
    else if(act==='sneeze'){ const s3=Math.max(0,Math.sin((u-0.35)*Math.PI/0.3));
      hx=(u<0.35? -0.35*(u/0.35) : 0.5*s3);
      Rx=-1.9*(u<0.5?1:1-s3); Rz=-0.35; Rf=-1.35; bz=0; by+=0.03*s3; }
    else if(act==='hum'){ bz=Math.sin(actT*2.6)*0.09; hy=Math.sin(actT*2.6)*0.22; by+=Math.abs(Math.sin(actT*2.6))*0.02; }
  }

  bodyPivot.rotation.z+=(bz-bodyPivot.rotation.z)*Math.min(1,dt*8);
  bodyPivot.rotation.x+=((lean-lieAmt*1.45)-bodyPivot.rotation.x)*Math.min(1,dt*5);
  bodyPivot.position.y=by-sitAmt*0.30+lieAmt*0.62;
  bodyPivot.position.z=lieAmt*0.55;

  const legBase=walking?step*0.5:0, legSit=sitAmt*(-1.3)+lieAmt*1.25;
  lL.up.rotation.x+=((legBase+legSit)-lL.up.rotation.x)*Math.min(1,dt*9);
  lR.up.rotation.x+=((-legBase+legSit)-lR.up.rotation.x)*Math.min(1,dt*9);
  const kneeT=walking?Math.max(0,-step)*0.5:sitAmt*0.9;
  lL.sh.rotation.x+=(kneeT-lL.sh.rotation.x)*Math.min(1,dt*9);
  lR.sh.rotation.x+=(Math.max(0,step)*0.5*(walking?1:0)+(walking?0:sitAmt*0.9)-lR.sh.rotation.x)*Math.min(1,dt*9);

  aL.up.rotation.x+=(Lx-aL.up.rotation.x)*Math.min(1,dt*k);
  aR.up.rotation.x+=(Rx-aR.up.rotation.x)*Math.min(1,dt*k);
  aL.up.rotation.z+=(Lz-aL.up.rotation.z)*Math.min(1,dt*k);
  aR.up.rotation.z+=(Rz-aR.up.rotation.z)*Math.min(1,dt*k);
  aL.fore.rotation.x+=(Lf-aL.fore.rotation.x)*Math.min(1,dt*k);
  aR.fore.rotation.x+=(Rf-aR.fore.rotation.x)*Math.min(1,dt*k);

  if(nodT>=0){nodT+=dt;hx=Math.sin(nodT*7)*0.26;if(nodT>1.8)nodT=-1;}
  headPivot.rotation.x+=(hx-headPivot.rotation.x)*Math.min(1,dt*6);
  headPivot.rotation.y+=(hy-headPivot.rotation.y)*Math.min(1,dt*6);

  const lit=(state==='FOCUS'&&atDesk&&!confirmingQuit);
  screen.material.color.setHex(lit?C.glassLit:C.glass);
  screenLight.position.set(man.position.x+0.2,0.62,man.position.z+0.55);
  screenLight.intensity+=((lit?0.8+Math.sin(t*9)*0.05:0)-screenLight.intensity)*Math.min(1,dt*6);

  smoke.forEach(s=>{
    if(!cig.visible){s.m.material.opacity=0;return;}
    s.t+=dt*0.42; if(s.t>1)s.t-=1;
    s.m.position.set(0.22+s.t*0.16,0.14+s.t*0.85,0.36-s.t*0.1);
    s.m.scale.setScalar(0.5+s.t*1.5);
    s.m.material.opacity=Math.max(0,0.42*(1-s.t)*(s.t<0.12?s.t/0.12:1));
  });
  const stinkOn=decayLv>=7;
  stink.forEach(s=>{
    if(!stinkOn){s.m.material.opacity=Math.max(0,s.m.material.opacity-dt);return;}
    s.t+=dt*0.35; if(s.t>1)s.t-=1;
    s.m.position.set(s.x,0.7+s.t*1.3,s.z);
    s.m.scale.setScalar(0.6+s.t*1.1);
    s.m.material.opacity=0.35*Math.sin(s.t*Math.PI);
  });
  flies.forEach(f=>{
    f.p+=dt*(2.4+f.r);
    f.m.position.set(Math.cos(f.p)*f.r,f.y+Math.sin(f.p*3)*0.12,Math.sin(f.p)*f.r*0.7);
    f.m.material.opacity+=((stinkOn?1:0)-f.m.material.opacity)*Math.min(1,dt*3);
  });

  // 頭のテカり：完走した瞬間だけ短いバーストで光る（常時は光らせない）
  if(sparkleT>=0){
    sparkleT+=dt;
    const dur=1.1, flash=sparkleT<dur?Math.sin((sparkleT/dur)*Math.PI):0;
    sparkleMat.opacity=flash*0.55; // 反射を抑えめに（以前は0.95で眩しすぎた）
    sparkle.scale.setScalar(0.5+flash*0.9);
    sparkle.rotation.z=sparkleT*3;
    if(sparkleT>dur) sparkleT=-1;
  } else {
    sparkleMat.opacity=0;
  }

  // 汗：作業がどれだけ進んだかに応じて、だらだら量が増える
  const sweatEffort=(state==='FOCUS')?Math.min(1,sTime/SESSION_SEC):0;
  sweatDrops.forEach(d=>{
    if(sweatEffort<=0.04){ d.m.opacity=0; return; }
    const c=(t+d.phase)%d.spot.cycle;
    if(c<d.spot.fall){
      const p=c/d.spot.fall;
      const amp=(0.35+0.55*sweatEffort)*Math.sin(Math.min(1,p/0.15)*Math.PI/2)*(p>0.7?Math.max(0,(1-p)/0.3):1);
      d.m.opacity=amp;
      d.g.position.set(d.spot.x,d.spot.y-p*0.22,d.spot.z+p*0.04);
      d.g.scale.setScalar(0.7+p*0.3);
    } else {
      d.m.opacity=0;
    }
  });

  if(rainGroup.visible){
    rainDrops.forEach(d=>{
      d.m.position.y-=d.sp*dt;
      if(d.m.position.y<-0.5){ d.m.position.y=rnd(10,15); d.m.position.x=rnd(-13,13); d.m.position.z=rnd(-13,13); }
    });
  }

  for(let i=pops.length-1;i>=0;i--){
    const p=pops[i]; p.t+=dt;
    const kk=Math.min(1,p.t/0.8);
    const s=(1-Math.pow(1-kk,3))+Math.sin(kk*Math.PI)*0.1;
    p.o.scale.set(s,s,s);
    if(kk>=1){p.o.scale.set(1,1,1);pops.splice(i,1);}
  }

  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
tick();

  // ===== 二関節の逆運動学：手先の目標座標から肩・肘の角度を解く =====
  const DOWN=new THREE.Vector3(0,-1,0);
  function solveLimb(root,joint,L1,L2,target,pole){
    const S=root.position;
    const toT=new THREE.Vector3().subVectors(target,S);
    const d=Math.min(toT.length(),(L1+L2)*0.995);
    const dir=toT.clone().normalize();
    const cosA=THREE.MathUtils.clamp((L1*L1+d*d-L2*L2)/(2*L1*d),-1,1);
    const a=Math.acos(cosA);
    const n=new THREE.Vector3().crossVectors(dir,pole.clone().normalize());
    if(n.lengthSq()<1e-6) n.set(0,0,1); else n.normalize();
    const upperDir=dir.clone().applyAxisAngle(n,a);
    const q1=new THREE.Quaternion().setFromUnitVectors(DOWN,upperDir);
    root.quaternion.copy(q1);
    const elbow=S.clone().add(upperDir.multiplyScalar(L1));
    const foreDir=new THREE.Vector3().subVectors(target,elbow).normalize();
    const foreLocal=foreDir.applyQuaternion(q1.clone().invert());
    joint.quaternion.copy(new THREE.Quaternion().setFromUnitVectors(DOWN,foreLocal));
  }

  // ===== 小物 =====
  const props=[];
  function addProp(obj,x,y,z,rot,scale,float){
    const g=new THREE.Group();
    g.add(obj); g.position.set(x,y,z); g.rotation.set(rot[0],rot[1],rot[2]);
    g.scale.setScalar(scale||1); world.add(g);
    props.push({g,base:new THREE.Vector3(x,y,z),s:scale||1,phase:Math.random()*6.28,
      amp:float?0.045:0,rot0:g.rotation.z,spin:float?0.08:0});
    return g;
  }
  function propLaptop(){
    const g=new THREE.Group();
    put(g,box(0.56,0.03,0.34,C.metal),0,0,0);
    const lid=new THREE.Group(); lid.position.set(0,0.01,0.16); g.add(lid);

  function propCoin(){
    const cv=document.createElement('canvas'); cv.width=cv.height=128;
    const cx=cv.getContext('2d');
    cx.fillStyle='#F5C24B'; cx.fillRect(0,0,128,128);
    cx.fillStyle='#FFE39B'; cx.beginPath(); cx.arc(64,64,50,0,6.29); cx.fill();

  function propCat(){

  function propHouse(){

      new THREE.MeshBasicMaterial({color:0xBFE3F2})),0.42,0.17,-0.08);
    put(g,box(0.3,0.2,0.04,C.rust),0.42,0.44,-d/2+0.06);

    put(g,box(0.34,0.02,0.02,0x6B655C),0.53,1.62,-0.2);

    put(g,box(0.2,0.26,0.02,0xE4E0D4),-0.22,0.61,d/2+0.05);

  addProp(propHouse(),  -1.07,0,-2.6,[0,-0.34,0],0.56);
  addProp(propPole(),   -1.02,0,-0.9,[0,0.2,0],0.5);
  addProp(propChabudai(),0.05,0,0.95,[0,0.34,0],0.7);
  addProp(propCat(),    -0.52,0,0.55,[0,0.7,0],0.85);
  addProp(propCrate(),   0.62,0,-0.25,[0,-0.4,0],0.7);
  addProp(propBucket(), -0.38,0,-0.75,[0,0.3,0],0.7);
  addProp(propBottle(),  0.34,0,0.62,[0,0.2,0],0.75);
  addProp(propRubble(), -0.72,0,-1.35,[0,0.4,0],0.7);
  addProp(propRubble(),  0.5,0,-1.6,[0,-0.5,0],0.6);
  addProp(propLaptop(), -0.55,1.45,0.5,[0.18,Math.PI+0.16,0.1],0.85,true);
  addProp(propClock(),   0.62,1.5,0.4,[0.08,-0.25,-0.2],0.68,true);
  addProp(propCoin(),    0.85,1.05,0.7,[0.35,0.2,0.28],0.75,true);
  addProp(propCoin(),   -0.62,1.12,0.85,[0.2,-0.3,-0.25],0.6,true);

  [[-1.07,-2.6,1.3,0.28],[-1.02,-0.9,0.35,0.3],[0.05,0.95,0.85,0.3],
   [0.62,-0.25,0.5,0.26],[-0.38,-0.75,0.36,0.24],[0.34,0.62,0.3,0.22],
   [-0.52,0.55,0.4,0.24]].forEach(o=>shadowBlob(o[2],o[2]*0.5,o[0],o[1],o[3]));

  function updCam(){
    const f=FRUST;
    camera.left=-f*W/H/2;camera.right=f*W/H/2;camera.top=f/2;camera.bottom=-f/2;
    camera.position.set(1.6,2.7,6.2);
    camera.lookAt(0.05,1.0,0.3);
    camera.updateProjectionMatrix();
  }
  function resize(){ W=host.clientWidth;H=host.clientHeight; renderer.setSize(W,H); updCam(); }
  addEventListener('resize',resize); resize();

  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let intro=reduce?1:0, drag=-1, stopped=false;

  document.getElementById('ttStart').addEventListener('click',()=>{
    drag=0;
    ttFrame.classList.add('tt-hide');
    setTimeout(()=>{
      stopped=true;
      try{ renderer.dispose(); }catch(e){}
      ttFrame.remove();
      showIntroTutorial();
    },560);
  });

  const clockT=new THREE.Clock();
  function tick(){
    if(stopped) return;
    const dt=Math.min(0.05,clockT.getDelta()), t=clockT.elapsedTime;
    if(intro<1) intro=Math.min(1,intro+dt/0.9);
    const e=1-Math.pow(1-intro,3);

    bodyPivot.position.z=reduce?0:Math.sin(t*1.05)*0.013;

    let puff=0;
    if(drag>=0){
      drag+=dt;
      puff=Math.sin(Math.min(1,drag/1.1)*Math.PI);
      if(drag>1.1) drag=-1;
    }
    emberMat.color.setHSL(0.045,0.85,0.42+0.2*(reduce?0.5:Math.abs(Math.sin(t*0.9)))+puff*0.25);
    headPivot.rotation.x=-0.06-puff*0.1;

    sparkleMat.opacity=reduce?0.75:0.45+Math.abs(Math.sin(t*1.05))*0.45;
    sparkle.rotation.z=t*0.6;
    sparkle.scale.setScalar(0.8+Math.sin(t*1.05)*0.16);

    mouth.getWorldPosition(mouthWorld);
    puffs.forEach(p=>{
      p.t+=dt*(0.2+puff*0.12); if(p.t>1) p.t-=1;
      p.m.position.set(
        mouthWorld.x+p.sway*p.t*0.3+Math.sin(t*0.7+p.t*6)*0.05,
        mouthWorld.y+p.t*1.6,
        mouthWorld.z+p.sway*p.t*0.14
      );
      p.m.scale.setScalar(0.4+p.t*1.8);
      p.m.material.opacity=Math.max(0,(0.32+puff*0.22)*(1-p.t)*(p.t<0.1?p.t/0.1:1));
    });

    props.forEach(p=>{
      const bob=(reduce?0:Math.sin(t*0.9+p.phase)*p.amp);
      p.g.position.set(p.base.x,p.base.y+bob+(1-e)*0.25,p.base.z);
      if(!reduce&&p.spin) p.g.rotation.z=p.rot0+Math.sin(t*0.6+p.phase)*0.06;
      p.g.scale.setScalar(p.s*(0.72+0.28*e));
    });

    renderer.render(scene,camera);
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
